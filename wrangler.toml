name = "security-resource-kit"
main = "server/index.ts"
compatibility_date = "2026-10-03"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/learn/*", "/tracks/*", "/about", "/sources", "/roadmap", "/account", "/management", "/management/*", "/discussions", "/discussions/*", "/training-media/*"]

[triggers]
crons = ["17 6 * * *"]

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://configure-before-deploy.invalid"
RP_ID = "configure-before-deploy.invalid"
LEGAL_APPROVED = "false"
OPERATOR_NAME = ""
CONTACT_URL = ""
TURNSTILE_SITE_KEY = ""

[[d1_databases]]
binding = "DB"
database_name = "security-resource-kit"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.local]
name = "security-resource-kit-local"

[env.local.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/learn/*", "/tracks/*", "/about", "/sources", "/roadmap", "/account", "/management", "/management/*", "/discussions", "/discussions/*", "/training-media/*"]

[env.local.vars]
ENVIRONMENT = "local"
APP_ORIGIN = "http://localhost:8787"
RP_ID = "localhost"
LEGAL_APPROVED = "false"
OPERATOR_NAME = "@oguzhanf_microsoft"
CONTACT_URL = ""
TURNSTILE_SITE_KEY = ""
RATE_LIMIT_SALT = "local-development-only-not-for-production"

[[env.local.d1_databases]]
binding = "DB"
database_name = "security-resource-kit-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
